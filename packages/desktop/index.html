<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Curium ● Privacy-First QR Code Generator</title>
    <meta name="description" content="Generate, customize, and scan QR codes fully offline. No analytics. No tracking. Open source under AGPL-3.0." />
    <meta name="keywords" content="qr code generator, qr code customizer, qr scanner, privacy, offline, open source" />
    <meta name="author" content="Nylxar" />
    <meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f0e8" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Curium" />
    <meta property="og:title" content="Curium ● Privacy-First QR Code Generator" />
    <meta property="og:description" content="Generate, customize, and scan QR codes fully offline. No analytics. No tracking. Open source." />
    <meta property="og:url" content="https://curium.design" />
    <meta property="og:image" content="https://curium.design/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Curium ● Privacy-First QR Code Generator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Curium ● Privacy-First QR Code Generator" />
    <meta name="twitter:description" content="Generate, customize, and scan QR codes fully offline. No analytics. No tracking. Open source." />
    <meta name="twitter:image" content="https://curium.design/og.png" />
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96x96.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <link rel="preload" href="./icon.png" as="image" />
    <style>
      :root { --font-mono: "IBM Plex Mono", monospace; color-scheme: dark light; }
      :root, [data-theme="dark"] { --bg: #0d0d0f; --surface: #161618; --surface-offset: #1e1e21; --border: #2a2a2e; --text: #f5f0e8; --text-muted: #b0a99e; --text-faint: #7a756d; --primary: #f5f0e8; --primary-bg: #f5f0e822; --success: #7ad88a; --error: #ff6b6b; --warning: #f5c46a; --selection-bg: #f5f0e833; --selection-text: #f5f0e8; }
      @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]):not([data-theme="amoled"]) { --bg: #f5f0e8; --surface: #fbf8f3; --surface-offset: #ebe6dd; --border: #d6cfc1; --text: #1a1a1f; --text-muted: #4a4640; --text-faint: #7a756d; --primary: #1a1a1f; --primary-bg: #1a1a1f18; --success: #2f8a3f; --error: #c43d3d; --warning: #b07a16; --selection-bg: #1a1a1f22; --selection-text: #1a1a1f; } }
      [data-theme="light"] { --bg: #f5f0e8; --surface: #fbf8f3; --surface-offset: #ebe6dd; --border: #d6cfc1; --text: #1a1a1f; --text-muted: #4a4640; --text-faint: #7a756d; --primary: #1a1a1f; --primary-bg: #1a1a1f18; --success: #2f8a3f; --error: #c43d3d; --warning: #b07a16; --selection-bg: #1a1a1f22; --selection-text: #1a1a1f; }
      [data-theme="amoled"] { --bg: #000000; --surface: #0a0a0a; --surface-offset: #141414; --border: #1e1e1e; --text: #f5f0e8; --text-muted: #b0a99e; --text-faint: #7a756d; --primary: #f5f0e8; --primary-bg: #f5f0e822; --success: #7ad88a; --error: #ff6b6b; --warning: #f5c46a; --selection-bg: #f5f0e828; --selection-text: #f5f0e8; }
      body { margin: 0; padding: 0; font-family: var(--font-mono); background: var(--bg); color: var(--text); }
      #curium-splash { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: var(--surface); pointer-events: none; }
      html[data-theme="light"] #curium-splash { background: #f5f0e8; }
      html[data-theme="amoled"] #curium-splash { background: #000000; }
      #curium-splash-content { display: flex; flex-direction: column; align-items: center; opacity: 0; transform: translateY(4px); transition: opacity 0.18s ease, transform 0.18s ease; }
      #curium-splash.loaded #curium-splash-content { opacity: 1; transform: translateY(0); }
      #curium-splash img { width: 72px; height: 72px; border-radius: 16px; }
      #curium-splash span { display: block; font-size: 16px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; margin-top: 14px; }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('curium_theme');
          if (!t || t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script>
      (function() {
        var img = new Image();
        img.onload = function() {
          var splash = document.getElementById('curium-splash');
          if (splash) splash.classList.add('loaded');
        };
        img.src = './icon.png';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="curium-splash">
      <div id="curium-splash-content">
        <img id="curium-splash-img" src="./icon.png" alt="" />
        <span>Curium</span>
      </div>
    </div>
    <script>
      // Fallback: if React fails to mount, remove splash after 3s
      setTimeout(function() {
        var s = document.getElementById('curium-splash');
        if (s) { s.style.display = 'none'; s.remove(); }
      }, 3000);
    </script>
  </body>
</html>
